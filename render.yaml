# Render Blueprint — tek tıkla deploy için.
# Render panelinde "New +" → "Blueprint" ile bu repoyu seç.
services:
  - type: web
    name: babacars
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn babacars.wsgi:application --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: SECRET_KEY
        generateValue: true        # Render otomatik güçlü key üretir
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_SSL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: babacars-db
          property: connectionString
      # E-posta (opsiyonel) — Render panelinden gerçek değerleri gir
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: babacars-db
    plan: free
