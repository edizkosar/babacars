<!-- Panel Navigation Tabs -->
<div class="mb-8">
  <div class="flex items-center gap-3 mb-6">
    <div class="gold-line"></div>
    <h1 class="text-3xl font-black tracking-tight text-ink">Yönetim Paneli</h1>
  </div>
  <nav class="flex gap-1 border-b border-warm-border">
    <a href="{% url 'controlpanel:home' %}"
       class="px-5 py-3 text-sm font-semibold tracking-wide uppercase transition-colors
       {% if request.resolver_match.url_name == 'home' %}text-gold border-b-2 border-gold{% else %}text-ink-light hover:text-ink{% endif %}">
      Genel
    </a>
    <a href="{% url 'controlpanel:users' %}"
       class="px-5 py-3 text-sm font-semibold tracking-wide uppercase transition-colors
       {% if request.resolver_match.url_name == 'users' %}text-gold border-b-2 border-gold{% else %}text-ink-light hover:text-ink{% endif %}">
      Kullanıcılar
    </a>
    <a href="{% url 'controlpanel:listings' %}"
       class="px-5 py-3 text-sm font-semibold tracking-wide uppercase transition-colors
       {% if request.resolver_match.url_name == 'listings' %}text-gold border-b-2 border-gold{% else %}text-ink-light hover:text-ink{% endif %}">
      İlanlar
    </a>
    <a href="{% url 'controlpanel:reports' %}"
       class="px-5 py-3 text-sm font-semibold tracking-wide uppercase transition-colors
       {% if request.resolver_match.url_name == 'reports' %}text-gold border-b-2 border-gold{% else %}text-ink-light hover:text-ink{% endif %}">
      Raporlar
    </a>
    <a href="{% url 'controlpanel:activity' %}"
       class="px-5 py-3 text-sm font-semibold tracking-wide uppercase transition-colors
       {% if request.resolver_match.url_name == 'activity' %}text-gold border-b-2 border-gold{% else %}text-ink-light hover:text-ink{% endif %}">
      Aktivite Logu
    </a>
  </nav>
</div>
